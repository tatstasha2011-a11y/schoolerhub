<!DOCTYPE html>
<html>
<head>
    <title>Schoolerhub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#0f172a;
            color:white;
            text-align:center;
            margin:0;
            padding:50px;
        }

        h1{
            font-size:40px;
        }

        .card{
            background:white;
            color:black;
            max-width:500px;
            margin:auto;
            padding:25px;

        }

        button{
            padding:15px 25px;
            font-size:18px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>

<body>

<h1>🏫 Schoolerhub</h1>

<div class="card">

<h2>Welcome!</h2>

<p>
Your School Management System is now online.
</p>

<button onclick="alert('Welcome to Schoolerhub!')">
Open Schoolerhub
</button>

</div>

</body>
</html>

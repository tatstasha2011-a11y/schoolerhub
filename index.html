
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schoolerhub Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 45px 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .school-icon {
            font-size: 70px;
        }

        h1 {
            margin: 10px 0;
            font-size: 45px;
            color: #111827;
        }

        .subtitle {
            font-size: 22px;
            color: #6b7280;
            margin-bottom: 40px;
        }

        input {
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #d1d5db;
            border-radius: 15px;
            font-size: 20px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: #2563eb;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }

        .footer {
            margin-top: 35px;
            color: #6b7280;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="school-icon">🏫</div>

    <h1>Schoolerhub</h1>

    <div class="subtitle">
        School Management System
    </div>

    <form onsubmit="login(event)">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        © 2026 Schoolerhub
    </div>

</div>

<script>

function login(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (username === "admin" && password === "admin123") {

        // Go directly to the dashboard
        window.location.href = "./dashboard.html";

    } else {

        document.getElementById("message").innerHTML =
            "❌ Incorrect username or password.";

    }

}

</script>

</body>
</html>

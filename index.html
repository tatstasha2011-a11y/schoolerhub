<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schoolerhub Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111827;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            font-size: 45px;
        }

        h1 {
            margin: 5px 0;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🏫</div>

    <h1>Schoolerhub</h1>

    <p class="subtitle">School Management System</p>

    <form onsubmit="login(event)">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <p id="message"></p>

    <div class="footer">
        © 2026 Schoolerhub
    </div>

</div>

<script>

function login(event) {

    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "admin123") {

        document.getElementById("message").innerHTML =
            "✅ Login successful!";

    } else {

        document.getElementById("message").innerHTML =
            "❌ Incorrect username or password.";

    }

}

</script>

</body>
</html>
